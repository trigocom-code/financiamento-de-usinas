name: Gate SOA/SOS - Fatos
'on': { push: {}, pull_request: {}, workflow_dispatch: {} }
jobs:
  validar-fatos:
    runs-on: ubuntu-latest
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar gatekeeper v2 (E0 regressao + E1 fatos + E2 cruzado + E3 html)
        run: python3 validar_fatos.py .
      - name: Selo catálogo — data de conferência (_meta.verificado_em)
        run: python3 tests/test_selo_data_conferencia.py
      - name: Checar allowlist de publicacao (_frescor.json)
        run: python3 scripts/checar_allowlist.py
      - name: Testes unitarios do gate (discover tests/)
        run: python3 -m unittest discover -s tests -v